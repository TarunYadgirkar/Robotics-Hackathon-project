<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>YAM Enrollment</title>
<style>
  :root{
    --bg:#FFFFFF; --panel:#FFFFFF; --hair:#E6E3E4;
    --text:#171214; --muted:#6E6469; --faint:#A79DA2;
    --rose:#E9A6B8;                 /* the arm */
    --red:#C2183C;                  /* enrollment progress */
    --red-soft:#F6DDE3;
    --amber:#B26A00;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;
       -webkit-font-smoothing:antialiased}
  canvas{display:block}
  /* touch-action:none is what stops Safari claiming the gesture as page zoom;
     without it a pinch minimises the tab instead of reaching the canvas. */
  #scene{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}
  html,body{touch-action:none;overscroll-behavior:none}

  header{position:fixed;top:0;left:0;right:0;padding:28px 32px;pointer-events:none;
         display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
  h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.015em}
  .prompt{margin:8px 0 0;color:var(--muted);font-size:14px;max-width:42ch;line-height:1.5}

  .readout{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.75;
           background:var(--panel);border-radius:12px;padding:12px 14px;min-width:196px;
           box-shadow:0 1px 2px rgba(23,18,20,.05),0 8px 24px rgba(23,18,20,.06)}
  .readout .row{display:flex;justify-content:space-between;gap:14px}
  .readout .row b{font-weight:500;color:var(--faint)}
  .readout .v{color:var(--text)}

  footer{position:fixed;bottom:0;left:0;right:0;padding:24px 32px 30px;
         display:flex;flex-direction:column;align-items:center;gap:16px}

  /* linear progress: the honest readout of "how enrolled is this object" */
  .meter{width:min(560px,72vw);height:4px;border-radius:999px;background:var(--red-soft);overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--red);border-radius:999px;
           transition:width .5s cubic-bezier(.22,.8,.3,1)}
  .stats{display:flex;gap:26px;font-family:var(--mono);font-size:11px;color:var(--faint)}
  .stats b{color:var(--red);font-weight:600}

  .controls{display:flex;gap:12px;align-items:center}
  button{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--text);
         background:var(--panel);border:none;border-radius:999px;padding:13px 22px;cursor:pointer;
         transition:transform .12s ease,box-shadow .18s ease,background .18s ease;
         box-shadow:0 1px 2px rgba(23,18,20,.06),0 6px 18px rgba(23,18,20,.07)}
  button:hover{background:#FCFAFB;box-shadow:0 2px 4px rgba(23,18,20,.08),0 10px 26px rgba(23,18,20,.10)}
  button:active{transform:scale(.975)}
  button.primary{background:var(--red);color:#fff;font-weight:600;padding:13px 30px;
                 box-shadow:0 2px 6px rgba(194,24,60,.28),0 10px 28px rgba(194,24,60,.22)}
  button.primary:hover{background:#D42149}
  .upload{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--text);background:var(--panel);
          border-radius:999px;padding:13px 22px;cursor:pointer;display:inline-block;
          box-shadow:0 1px 2px rgba(23,18,20,.06),0 6px 18px rgba(23,18,20,.07)}
  .upload:hover{background:#FCFAFB}
  kbd{font-family:var(--mono);font-size:10px;color:var(--faint);background:#F4F1F2;border-radius:4px;
      padding:2px 5px;margin-left:8px}
  button.primary kbd{background:rgba(255,255,255,.22);color:#fff}

  @media (max-width: 760px){
    header{padding:16px 16px 0;flex-direction:column;gap:10px}
    h1{font-size:20px}
    .prompt{font-size:13px;max-width:none}
    .readout{display:none}          /* six joint angles are not worth a phone screen */
    footer{padding:12px 12px 18px;gap:10px}
    .controls{flex-wrap:wrap;justify-content:center;gap:8px}
    button,.upload{padding:11px 16px;font-size:13px}
    kbd{display:none}
    .stats{flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:10px}
    #toast{bottom:150px}
  }

  .badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);
         background:var(--panel);border-radius:999px;padding:6px 13px;
         box-shadow:0 1px 2px rgba(23,18,20,.05),0 6px 18px rgba(23,18,20,.06)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--red);animation:breathe 2.4s ease-in-out infinite}
  .dot.stale{background:var(--amber)}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.3}}

  #flash{position:fixed;inset:0;pointer-events:none;background:var(--red);opacity:0;
         transition:opacity .5s ease}
  #toast{position:fixed;left:50%;bottom:132px;transform:translateX(-50%) translateY(8px);
         background:var(--text);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;
         opacity:0;transition:opacity .25s ease,transform .25s ease;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.warn{background:var(--amber)}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<header>
  <div>
    <p class="eyebrow">Obstacle enrollment</p>
    <h1 id="objectName">—</h1>
    <p class="prompt" id="prompt">Connecting…</p>
    <div style="margin-top:14px"><span class="badge"><span class="dot" id="liveDot"></span><span id="liveText">live</span></span></div>
  </div>
  <div class="readout" id="readout"></div>
</header>

<footer>
  <div class="meter"><i id="meterFill"></i></div>
  <div class="stats">
    <span>points <b id="statPoints">0</b></span>
    <span>directions <b id="statPatches">0</b></span>
    <span>coverage <b id="statCoverage">0%</b></span>
    <span>tip <b id="statTip">—</b></span>
    <span>poses logged <b id="statPoses">0</b></span>
    <span>scan <b id="statScan">none</b></span>
    <span>aligned <b id="statAlign">—</b></span>
  </div>
  <div class="controls">
    <button id="btnUndo">Undo<kbd>U</kbd></button>
    <button class="primary" id="btnCapture">Capture point<kbd>SPACE</kbd></button>
    <button id="btnNext">Next object<kbd>N</kbd></button>
    <button id="btnReference">Reference<kbd>E</kbd></button>
    <button id="btnRecenter">Recenter<kbd>R</kbd></button>
    <button id="btnDone">Finish<kbd>F</kbd></button>
    <label class="upload" for="scanFile">Upload scan</label>
    <input id="scanFile" type="file" accept=".ply,.obj,.stl" hidden>
  </div>
</footer>

<div id="flash"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const AZIMUTH = 8, BANDS = 3, PATCHES = AZIMUTH * BANDS;

/* Over a tunnel the API is token-guarded; the token rides in this page's own
   URL so the link the operator opens is the only thing they need to carry. */
const TOKEN = new URLSearchParams(location.search).get('k') || '';
const authHeaders = TOKEN ? {'X-Token': TOKEN} : {};

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0xffffff, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffffff, 2.0, 4.2);
const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 60);

scene.add(new THREE.HemisphereLight(0xffffff, 0xf0e6ea, 1.05));
const key = new THREE.DirectionalLight(0xffffff, 0.55); key.position.set(1.3, 1.8, 1.1); scene.add(key);
const fill = new THREE.DirectionalLight(0xffe9ef, 0.35); fill.position.set(-1.5, 0.4, -1.0); scene.add(fill);

/* Robot is Z-up, three.js is Y-up: rotate the world once instead of
   transposing every matrix that arrives from the server. */
const world = new THREE.Group();
world.rotation.x = -Math.PI / 2;
scene.add(world);

const grid = new THREE.GridHelper(2, 20, 0xdcd6d9, 0xece7e9);
grid.rotation.x = Math.PI / 2;
world.add(grid);

const linkGroups = {};

/* Holographic rather than matte: no diffuse term at all. The surface is a black
   or white base (baked per vertex, so the white band across the middle of the
   long links is part of the mesh rather than a separate material) lifted by a
   fresnel-driven iridescence that only appears at grazing angles. Lambert
   shading would read as painted plastic; this reads as a projection. */
const holoMaterial = new THREE.ShaderMaterial({
  transparent: true,
  side: THREE.DoubleSide,
  uniforms: { uTime:{value:0}, uSheen:{value:0.85} },
  vertexShader: `
    varying vec3 vNormalW;
    varying vec3 vViewDir;
    varying vec3 vBase;
    varying vec3 vWorld;
    void main(){
      vBase = color;
      vNormalW = normalize(mat3(modelMatrix) * normal);
      vec4 worldPosition = modelMatrix * vec4(position, 1.0);
      vWorld = worldPosition.xyz;
      vViewDir = cameraPosition - worldPosition.xyz;
      gl_Position = projectionMatrix * viewMatrix * worldPosition;
    }`,
  fragmentShader: `
    uniform float uTime;
    uniform float uSheen;
    varying vec3 vNormalW;
    varying vec3 vViewDir;
    varying vec3 vBase;
    varying vec3 vWorld;
    void main(){
      vec3 normal = normalize(vNormalW);
      vec3 view = normalize(vViewDir);
      float facing = abs(dot(normal, view));
      float fresnel = pow(1.0 - facing, 2.3);

      // Cosine palette: cheap spectral sweep without a lookup texture.
      vec3 phase = vec3(0.0, 0.33, 0.67);
      vec3 iridescence = 0.5 + 0.5 * cos(6.28318 * (phase + fresnel * 1.35 + normal.y * 0.30 + uTime * 0.04));

      // Black body or white band, baked per vertex.
      vec3 base = mix(vec3(0.055), vec3(0.93), vBase.r);

      // Faint horizontal banding, the one overt "projection" cue.
      float scan = 0.030 * sin(vWorld.z * 190.0 - uTime * 1.1);

      // Damp the additive sheen where the base is already bright: full sheen on
      // the white bands blows them out to a glowing bar instead of white paint.
      float sheen = uSheen * mix(1.0, 0.30, vBase.r);
      vec3 color = base + iridescence * fresnel * sheen + scan * (1.0 - 0.6 * vBase.r);
      float alpha = mix(0.80, 1.0, fresnel);
      gl_FragColor = vec4(color, alpha);
    }`,
});
holoMaterial.vertexColors = true;

fetch('/api/static/meshes', {headers: authHeaders}).then(r => r.json()).then(meshes => {
  for (const [name, data] of Object.entries(meshes)){
    if (!data.positions || !data.positions.length) continue;
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(data.positions, 3));
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(data.colors || new Array(data.positions.length).fill(0), 3));
    geometry.setIndex(data.indices);
    geometry.computeVertexNormals();
    const group = new THREE.Group();
    group.matrixAutoUpdate = false;
    group.add(new THREE.Mesh(geometry, holoMaterial));
    world.add(group);
    linkGroups[name] = group;
  }
});

/* ------------------------------------------------- 3D coverage shell ----- */
/* The 3D analogue of a FaceID ring: a shell of patches around the object,
   one per direction band. Touching the object from a new direction lights the
   patch you touched from, so "which sides have I covered" is answered in the
   same space the object lives in. */
const shell = new THREE.Group();
world.add(shell);
const shellPatches = [];

function buildShell(radius){
  while (shell.children.length) shell.remove(shell.children[0]);
  shellPatches.length = 0;
  for (let band = 0; band < BANDS; band++){
    // Server bins elevation from -pi/2..pi/2; three's theta runs from the +Y pole down.
    const thetaStart = Math.PI * (1 - (band + 1) / BANDS);
    const thetaLength = Math.PI / BANDS;
    for (let a = 0; a < AZIMUTH; a++){
      const geometry = new THREE.SphereGeometry(
        radius, 14, 8,
        (a / AZIMUTH) * Math.PI * 2, (Math.PI * 2) / AZIMUTH,
        thetaStart, thetaLength
      );
      const material = new THREE.MeshBasicMaterial({
        color:0xC2183C, transparent:true, opacity:0.03,
        side:THREE.DoubleSide, depthWrite:false
      });
      const patch = new THREE.Mesh(geometry, material);
      shell.add(patch);
      shellPatches.push(patch);
    }
  }
}
buildShell(0.18);

function paintShell(patches, centroid, radius){
  if (!shellPatches.length) return;
  if (Math.abs(radius - shell.userData.radius) > 0.015){
    buildShell(radius); shell.userData.radius = radius;
  }
  if (centroid) shell.position.set(centroid[0], centroid[1], centroid[2]);
  shellPatches.forEach((patch, index) => {
    const on = patches && patches[index];
    // Unlit patches stay barely there: the shell should read as a hint of a
    // volume, not a grey ball parked in front of the arm.
    patch.material.opacity = on ? 0.34 : 0.022;
    patch.material.color.setHex(on ? 0xC2183C : 0xB9AEB3);
  });
}

/* captured points */
const pointGroup = new THREE.Group(); world.add(pointGroup);
const pointGeometry = new THREE.SphereGeometry(0.012, 18, 14);
const pointMaterial = new THREE.MeshStandardMaterial({color:0xC2183C, roughness:.35, metalness:.0});
const pulses = [];

function setPoints(list){
  while (pointGroup.children.length > list.length) pointGroup.remove(pointGroup.children[pointGroup.children.length-1]);
  list.forEach((p, index) => {
    let dot = pointGroup.children[index];
    if (!dot){
      dot = new THREE.Mesh(pointGeometry, pointMaterial);
      pointGroup.add(dot);
      pulses.push({mesh:dot, born:performance.now()});
    }
    dot.position.set(p[0], p[1], p[2]);
  });
}

let boxHelper = null;
function setBox(min, max){
  if (boxHelper){ world.remove(boxHelper); boxHelper.geometry.dispose(); boxHelper = null; }
  if (!min || !max) return;
  const size = [max[0]-min[0], max[1]-min[1], max[2]-min[2]];
  if (Math.min(...size) <= 0) return;
  boxHelper = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(size[0], size[1], size[2])),
    new THREE.LineBasicMaterial({color:0xC2183C, transparent:true, opacity:.75})
  );
  boxHelper.position.set(min[0]+size[0]/2, min[1]+size[1]/2, min[2]+size[2]/2);
  world.add(boxHelper);
}

const tipMarker = new THREE.Mesh(
  new THREE.SphereGeometry(0.015, 20, 16),
  new THREE.MeshStandardMaterial({color:0x171214, roughness:.4})
);
world.add(tipMarker);

/* ------------------------------------------------------- orbit camera ---- */
/* Hand-rolled: cdnjs serves three.min.js but not the examples bundle, and one
   more network dependency is one more way for this to break at demo time.
   Pointer events cover mouse and touch together; the multi-touch bookkeeping is
   what makes pinch-zoom and two-finger pan work on a phone. */
let yaw = 0.9, pitch = 0.30, distance = 1.30;
const target = new THREE.Vector3(0, 0.30, 0);   // scene is Y-up; robot Z maps to scene Y
const HOME_VIEW = {yaw: 0.9, pitch: 0.30, distance: 1.30, target: [0, 0.30, 0]};

const pointers = new Map();
let pinchDistance = 0, pinchMidpoint = null;

function pointerList(){ return [...pointers.values()]; }

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pointers.size === 2){
    const [a, b] = pointerList();
    pinchDistance = Math.hypot(a.x - b.x, a.y - b.y);
    pinchMidpoint = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};
  }
});

function endPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size < 2){ pinchDistance = 0; pinchMidpoint = null; }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', endPointer);

canvas.addEventListener('pointermove', e => {
  const previous = pointers.get(e.pointerId);
  if (!previous) return;
  e.preventDefault();
  const current = {x: e.clientX, y: e.clientY};

  if (pointers.size === 1){
    yaw -= (current.x - previous.x) * 0.006;
    pitch = Math.max(-1.35, Math.min(1.45, pitch - (current.y - previous.y) * 0.006));
  }
  pointers.set(e.pointerId, current);

  if (pointers.size === 2){
    const [a, b] = pointerList();
    const spread = Math.hypot(a.x - b.x, a.y - b.y);
    const midpoint = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};

    if (pinchDistance > 0 && spread > 0){
      distance = clampDistance(distance * (pinchDistance / spread));
    }
    if (pinchMidpoint){
      // Two-finger drag pans the look-at point, in the camera's own plane.
      panBy((midpoint.x - pinchMidpoint.x), (midpoint.y - pinchMidpoint.y));
    }
    pinchDistance = spread;
    pinchMidpoint = midpoint;
  }
}, {passive: false});

function clampDistance(value){ return Math.max(0.35, Math.min(4.0, value)); }

function panBy(dx, dy){
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
  const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
  const scale = distance * 0.0016;
  target.addScaledVector(right, -dx * scale);
  target.addScaledVector(up, dy * scale);
}

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  distance = clampDistance(distance * (1 + Math.sign(e.deltaY) * 0.08));
}, {passive:false});

function resetView(){
  yaw = HOME_VIEW.yaw;
  pitch = HOME_VIEW.pitch;
  distance = HOME_VIEW.distance * framingForAspect();
  target.set(...HOME_VIEW.target);
}

/* A phone in portrait sees far less width, so the same camera distance puts the
   arm off the sides. Pull back in proportion to how narrow the viewport is. */
function framingForAspect(){
  const aspect = innerWidth / innerHeight;
  return aspect >= 1 ? 1 : Math.min(1.9, 1 / Math.max(aspect, 0.45));
}

function resize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(() => { resize(); resetView(); }, 250));
resize();
distance = HOME_VIEW.distance * framingForAspect();

/* -------------------------------------------------- scan + registration --- */
/* The scan arrives in the phone's own frame. Pairing features the arm has
   physically touched with the same features clicked in the scan is what ties
   the two frames together; three pairs determine the rigid transform. */
let scanCloud = null;
let loadedScan = null;
let scanRegistered = false;
let referencePoints = [];
const pairs = [];               // {scan:[x,y,z], robot:[x,y,z]}

const markerGeometry = new THREE.SphereGeometry(0.018, 16, 12);
const referenceMaterial = new THREE.MeshStandardMaterial({color:0x171214, roughness:.4});
const pairedMaterial = new THREE.MeshStandardMaterial({color:0x1E8E5A, roughness:.4});
const referenceGroup = new THREE.Group(); world.add(referenceGroup);

function setReferenceMarkers(list){
  while (referenceGroup.children.length > list.length) referenceGroup.remove(referenceGroup.children.at(-1));
  list.forEach((p, index) => {
    let marker = referenceGroup.children[index];
    if (!marker){
      marker = new THREE.Mesh(markerGeometry, referenceMaterial);
      referenceGroup.add(marker);
    }
    marker.position.set(p[0], p[1], p[2]);
    marker.material = index < pairs.length ? pairedMaterial : referenceMaterial;
  });
}

async function loadScan(){
  const data = await (await fetch('/api/scan_points', {headers: authHeaders})).json();
  if (scanCloud){ world.remove(scanCloud); scanCloud.geometry.dispose(); scanCloud = null; }
  if (!data.points || !data.points.length) return;

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(data.points, 3));
  scanRegistered = data.registered;
  scanCloud = new THREE.Points(geometry, new THREE.PointsMaterial({
    size: 0.006,
    color: scanRegistered ? 0xC2183C : 0x9AA0A6,
    transparent: true,
    opacity: scanRegistered ? 0.65 : 0.42,
  }));
  world.add(scanCloud);
  el('statAlign').textContent = scanRegistered ? `${data.rmse_mm} mm` : 'not yet';
}

const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.02;

function pickScanPoint(clientX, clientY){
  if (!scanCloud) return null;
  const ndc = new THREE.Vector2((clientX / innerWidth) * 2 - 1, -(clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObject(scanCloud);
  if (!hits.length) return null;
  // Back into robot-frame coordinates: the cloud lives under the Z-up world group.
  return world.worldToLocal(hits[0].point.clone()).toArray();
}

async function tryPair(clientX, clientY){
  if (!scanCloud || scanRegistered) return;
  if (pairs.length >= referencePoints.length){
    toast('touch another reference point with the arm first', 'warn');
    return;
  }
  const picked = pickScanPoint(clientX, clientY);
  if (!picked) return;

  pairs.push({scan: picked, robot: referencePoints[pairs.length]});
  setReferenceMarkers(referencePoints);
  toast(`paired ${pairs.length} of 3 needed`);

  if (pairs.length >= 3){
    const response = await (await fetch('/api/register', {
      method:'POST', headers:{'Content-Type':'application/json', ...authHeaders},
      body: JSON.stringify({scan: pairs.map(p => p.scan), robot: pairs.map(p => p.robot)})
    })).json();
    if (response.error){ toast(response.error, 'warn'); return; }
    toast(response.trustworthy
      ? `aligned to ${response.rmse_mm} mm`
      : `aligned but ${response.rmse_mm} mm off -- re-touch the references`,
      response.trustworthy ? '' : 'warn');
    await loadScan();
  }
}

/* A tap is a click that did not become a drag: on a phone every orbit starts
   with a pointerdown, so distance and duration are what separate them. */
let tapStart = null;
canvas.addEventListener('pointerdown', e => { tapStart = {x: e.clientX, y: e.clientY, t: performance.now()}; });
canvas.addEventListener('pointerup', e => {
  if (!tapStart) return;
  const moved = Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y);
  if (moved < 8 && performance.now() - tapStart.t < 350) tryPair(e.clientX, e.clientY);
  tapStart = null;
});

/* ---------------------------------------------------------------- state --- */
let lastSeen = 0, lastPointCount = 0;
const el = id => document.getElementById(id);

function applyTransforms(transforms){
  for (const [name, values] of Object.entries(transforms || {})){
    const group = linkGroups[name];
    if (!group) continue;
    // Row-major 4x4 from numpy; Matrix4.set() takes row-major arguments.
    group.matrix.set(...values);
    // With matrixAutoUpdate off, three.js only recomposes matrixWorld when this
    // flag is set; without it every update after the first frame is discarded.
    group.matrixWorldNeedsUpdate = true;
  }
}

function render(state){
  el('objectName').textContent = state.object_name || 'Untitled object';
  el('prompt').textContent = state.prompt || '';

  const points = state.points || [];
  const covered = (state.patches || []).filter(Boolean).length;
  el('statPoints').textContent = state.point_count ?? 0;
  el('statPatches').textContent = covered;
  el('statCoverage').textContent = Math.round((state.progress || 0) * 100) + '%';
  el('statPoses').textContent = state.pose_samples ?? 0;
  const scans = state.scans || [];
  el('statScan').textContent = scans.length ? scans[scans.length - 1] : 'none';
  if (scans.length && scans[scans.length - 1] !== loadedScan){
    loadedScan = scans[scans.length - 1];
    pairs.length = 0;
    loadScan();
  }
  referencePoints = state.references || [];
  setReferenceMarkers(referencePoints);
  el('meterFill').style.width = Math.round((state.progress || 0) * 100) + '%';

  if (state.tip){
    el('statTip').textContent = state.tip.map(v => v.toFixed(3)).join(', ');
    tipMarker.position.set(state.tip[0], state.tip[1], state.tip[2]);
    tipMarker.visible = true;
  } else tipMarker.visible = false;

  if (state.joints){
    el('readout').innerHTML = state.joints
      .map((v,i) => `<div class="row"><b>joint${i+1}</b><span class="v">${(v*180/Math.PI).toFixed(2)}&deg;</span></div>`).join('')
      + (state.temperature ? `<div class="row" style="margin-top:6px"><b>max temp</b><span class="v">${state.temperature.toFixed(0)}&deg;C</span></div>` : '');
  }

  applyTransforms(state.link_transforms);
  setPoints(points);
  setBox(state.box_min, state.box_max);

  // Size the shell to the object so it frames what is being enrolled.
  let centroid = null, radius = 0.18;
  if (points.length){
    centroid = [0,1,2].map(i => points.reduce((s,p) => s + p[i], 0) / points.length);
    const spread = Math.max(...points.map(p => Math.hypot(p[0]-centroid[0], p[1]-centroid[1], p[2]-centroid[2])));
    radius = Math.min(0.26, Math.max(0.13, spread + 0.045));
  }
  paintShell(state.patches, centroid, radius);
  shell.visible = points.length >= 2;

  if ((state.point_count ?? 0) > lastPointCount) flash();
  lastPointCount = state.point_count ?? 0;
  if (state.message) toast(state.message, state.message_kind);
}

function flash(){
  const f = el('flash');
  f.style.transition = 'none'; f.style.opacity = '.10';
  requestAnimationFrame(() => { f.style.transition = 'opacity .5s ease'; f.style.opacity = '0'; });
}

let toastTimer = null;
function toast(text, kind){
  const t = el('toast');
  if (t.dataset.text === text && t.classList.contains('show')) return;
  t.dataset.text = text; t.textContent = text;
  t.className = 'show' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 2600);
}

async function poll(){
  try{
    const state = await (await fetch('/api/state', {headers: authHeaders})).json();
    lastSeen = performance.now();
    render(state);
    if (state.status === 'finished') el('prompt').textContent = 'Enrollment saved. You can close this window.';
  }catch(e){ /* staleness dot covers it */ }
}
setInterval(poll, 120); poll();

const send = action => fetch('/api/command', {
  method:'POST', headers:{'Content-Type':'application/json', ...authHeaders}, body: JSON.stringify({action})
}).catch(()=>{});

el('btnCapture').onclick = () => send('capture');
el('btnUndo').onclick    = () => send('undo');
el('btnNext').onclick    = () => send('next');
el('btnDone').onclick    = () => send('done');
el('btnRecenter').onclick = () => { resetView(); toast('view reset'); };
el('btnReference').onclick = () => send('reference');
el('scanFile').addEventListener('change', async event => {
  const file = event.target.files[0];
  if (!file) return;
  toast(`uploading ${file.name}…`);
  try{
    await fetch('/api/scan', {method:'POST', headers:{'X-Filename': file.name, ...authHeaders}, body: file});
  }catch(e){ toast('upload failed', 'warn'); }
  event.target.value = '';
});

addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (e.code === 'Space'){ e.preventDefault(); send('capture'); }
  else if (k === 'u') send('undo');
  else if (k === 'n') send('next');
  else if (k === 'f') send('done');
  else if (k === 'r'){ resetView(); toast('view reset'); }
  else if (k === 'e') send('reference');
});

function tick(now){
  const stale = now - lastSeen > 1200;
  el('liveDot').className = 'dot' + (stale ? ' stale' : '');
  el('liveText').textContent = stale ? 'reconnecting' : 'live';

  for (let i = pulses.length - 1; i >= 0; i--){
    const age = (now - pulses[i].born) / 420;
    if (age >= 1){ pulses[i].mesh.scale.setScalar(1); pulses.splice(i,1); continue; }
    pulses[i].mesh.scale.setScalar(1 + 2.4 * (1-age) * (1-age));
  }
  shell.rotation.z += 0.0012;   // slow drift keeps the shell readable as a volume
  holoMaterial.uniforms.uTime.value = now * 0.001;

  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  camera.position.set(
    target.x + distance * cp * Math.sin(yaw),
    target.y + distance * sp,
    target.z + distance * cp * Math.cos(yaw)
  );
  camera.lookAt(target);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
