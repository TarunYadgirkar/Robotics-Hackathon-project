<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Planned path</title>
<style>
 :root{--red:#C2183C;--ink:#171214;--muted:#6E6469}
 *{box-sizing:border-box} html,body{height:100%;margin:0}
 body{background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
 canvas{display:block} #scene{position:fixed;inset:0;width:100vw;height:100vh}
 header{position:fixed;top:0;left:0;right:0;padding:22px 26px;pointer-events:none}
 .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#A79DA2;margin:0 0 5px}
 h1{margin:0;font-size:22px;font-weight:600}
 p.sub{margin:6px 0 0;color:var(--muted);font-size:13px}
 footer{position:fixed;bottom:0;left:0;right:0;padding:18px 26px 24px;display:flex;flex-direction:column;align-items:center;gap:12px}
 .bar{width:min(620px,80vw);height:4px;border-radius:99px;background:#F2E4E8;overflow:hidden}
 .bar i{display:block;height:100%;width:0;background:var(--red)}
 .row{display:flex;gap:20px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)}
 .row b{color:var(--red)}
 button{font:inherit;font-size:14px;font-weight:500;background:#fff;border:0;border-radius:99px;padding:10px 20px;cursor:pointer;
        box-shadow:0 1px 2px rgba(0,0,0,.07),0 6px 18px rgba(0,0,0,.08)}
 .legend{position:fixed;right:26px;top:22px;font-size:12px;color:var(--muted);background:#fff;border-radius:12px;padding:12px 14px;
         box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);line-height:1.7}
 .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
</style></head><body>
<canvas id="scene"></canvas>
<header>
  <p class="eyebrow">Collision-avoidance preview</p>
  <h1>Planned path — nothing has moved</h1>
  <p class="sub">Drag to orbit, scroll to zoom. Scrub the path below before executing.</p>
</header>
<div class="legend">
  <div><span class="sw" style="background:#E9A6B8"></span>arm</div>
  <div><span class="sw" style="background:#C2183C"></span>LiDAR scan, registered (arm subtracted)</div>
  <div><span class="sw" style="background:#171214"></span>tip path</div>
</div>
<footer>
  <div class="bar"><i id="fill"></i></div>
  <div class="row"><span>pose <b id="n">0</b></span><span>obstacles drawn <b id="shown">-</b></span><span id="ang"></span></div>
  <div style="display:flex;gap:10px"><button id="play">Pause</button><button id="focus">Centre on arm</button></div>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA = __PAYLOAD__;
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setClearColor(0xffffff,1);
const scene=new THREE.Scene(); const camera=new THREE.PerspectiveCamera(38,1,0.01,60);
scene.add(new THREE.HemisphereLight(0xffffff,0xf0e6ea,1.05));
const key=new THREE.DirectionalLight(0xffffff,.55); key.position.set(1.3,1.8,1.1); scene.add(key);
const world=new THREE.Group(); world.rotation.x=-Math.PI/2; scene.add(world);
const grid=new THREE.GridHelper(2,20,0xdcd6d9,0xece7e9);
grid.rotation.x=Math.PI/2;   // Object3D.rotation is read-only; assign through it
world.add(grid);

const armMat=new THREE.MeshStandardMaterial({color:0xE9A6B8,metalness:.06,roughness:.52});
const links={};
for(const [name,d] of Object.entries(DATA.meshes)){
  if(!d.positions?.length) continue;
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(d.positions,3));
  g.setIndex(d.indices); g.computeVertexNormals();
  const grp=new THREE.Group(); grp.matrixAutoUpdate=false; grp.add(new THREE.Mesh(g,armMat));
  world.add(grp); links[name]=grp;
}

// Obstacles as instanced cubes: one draw call for thousands of voxels.
const v=DATA.voxels;
const REACH=0.85;                       // beyond this the arm cannot touch anything
const near=[];
for(let i=0;i<v.length;i+=3){
  const x=v[i],y=v[i+1],z=v[i+2];
  // Everything here is measured geometry from the scan -- the table with its
  // real edge, the clamps, whatever else is on the bench. Nothing is culled
  // except what lies outside the arm's reach.
  if(Math.hypot(x,y)<=REACH && z<=0.9) near.push([x,y,z]);
}
const inst=new THREE.InstancedMesh(
  new THREE.BoxGeometry(DATA.voxelSize*0.9,DATA.voxelSize*0.9,DATA.voxelSize*0.9),
  new THREE.MeshStandardMaterial({color:0xC2183C,transparent:true,opacity:.42,roughness:.6}),
  near.length);
const dummy=new THREE.Object3D();
near.forEach((p,i)=>{ dummy.position.set(p[0],p[1],p[2]); dummy.updateMatrix(); inst.setMatrixAt(i,dummy.matrix); });
world.add(inst);
document.getElementById('shown').textContent=`${near.length.toLocaleString()} of ${(v.length/3).toLocaleString()}`;

const tip=DATA.tip.flat();
world.add(new THREE.Line(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(tip,3)),
  new THREE.LineBasicMaterial({color:0x171214})));

let yaw=0.9,pitch=0.32,dist=1.2;
const target=new THREE.Vector3(0,0.25,0);

/* Frame the whole motion, not one pose. Framing on the first frame put the
   camera close around a folded arm, which then extended straight out of shot.
   The tip's full track plus the base spans everything the arm will occupy. */
function focusArm(){
  const box=new THREE.Box3();
  box.expandByPoint(new THREE.Vector3(0,0,0));                 // the base
  for(const p of DATA.tip) box.expandByPoint(new THREE.Vector3(p[0],p[2],-p[1]));  // robot Z -> scene Y
  box.expandByScalar(0.18);                                    // the arm has width
  box.getCenter(target);
  dist=Math.max(1.1, box.getSize(new THREE.Vector3()).length()*1.15);
  yaw=0.9; pitch=0.30;
}
let drag=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.006;pitch=Math.max(-1.3,Math.min(1.4,pitch-(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY});
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(.5,Math.min(5,dist*(1+Math.sign(e.deltaY)*.08)))},{passive:false});
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize); resize();

let frame=0, playing=true;
document.getElementById('focus').onclick=()=>focusArm();
document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play'};
function setFrame(i){
  const f=DATA.frames[i];
  for(const [name,m] of Object.entries(f)){ const g=links[name]; if(!g)continue; g.matrix.set(...m); g.matrixWorldNeedsUpdate=true; }
  document.getElementById('n').textContent=`${i+1}/${DATA.frames.length}`;
  document.getElementById('fill').style.width=((i+1)/DATA.frames.length*100)+'%';
  document.getElementById('ang').innerHTML=DATA.angles[i].map((a,j)=>`${DATA.joints[j]} <b>${a.toFixed(0)}&deg;</b>`).join('  ');
}
let framedOnce=false;
function tick(t){
  if(playing){ frame=Math.floor(t/60)%DATA.frames.length; setFrame(frame); }
  if(!framedOnce && Object.keys(links).length){ setFrame(0); world.updateMatrixWorld(true); focusArm(); framedOnce=true; }
  const cp=Math.cos(pitch),sp=Math.sin(pitch);
  camera.position.set(target.x+dist*cp*Math.sin(yaw),target.y+dist*sp,target.z+dist*cp*Math.cos(yaw));
  camera.lookAt(target); renderer.render(scene,camera); requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script></body></html>
